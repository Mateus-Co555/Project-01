{% extends 'learning_logs/base.html'%}
{% block content %}
    <h3>Topicos</h3>
    <ul>
        {% for topic in topic%}
            <li><a href="{% url 'topic' topic.id %}">{{topic}}</a></li>
        {% empty %}
            <li>There're not topics</li>
        {% endfor%}
    </ul>
    <a href="{% url 'new_topic'  %}">Adicionar novo topico</a>
{% endblock content %}
